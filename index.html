<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#E9EEF3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #E9EEF3;
    --card: #FFFFFF;
    --ink: #14213D;
    --muted: #5D6B80;
    --line: #D3DCE6;
    --empty: #EDF1F6;
    --accent: #2F5BFF;
    --danger: #C2263F;
    --undo: #9DB4FF;
    --font: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1624; --card: #182236; --ink: #EAF0FA; --muted: #92A0B8;
      --line: #2A3752; --empty: #1F2B43; --accent: #7C9BFF; --danger: #FF7A8E; --undo: #2F5BFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1624; --card: #182236; --ink: #EAF0FA; --muted: #92A0B8;
    --line: #2A3752; --empty: #1F2B43; --accent: #7C9BFF; --danger: #FF7A8E; --undo: #2F5BFF;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 56px; }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .date { margin: 0 0 2px; color: var(--muted); font-size: 15px; font-weight: 500; }
  h1 { margin: 0; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  .tally { text-align: right; }
  .tally-num { font-size: 56px; line-height: 0.9; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .tally-num small { font-size: 24px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .tally-label { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 22px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }

  /* Habit card */
  .habit { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 12px; margin-bottom: 12px; }
  .habit-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .name-btn { background: none; border: 0; padding: 4px 0; text-align: left; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .name-btn .swatch { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex: none; }
  .name-btn span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .streak { flex: none; text-align: right; font-size: 13px; color: var(--muted); line-height: 1.25; }
  .streak b { display: block; font-size: 20px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Today's goal row */
  .goal-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--empty); border-radius: 14px; padding: 8px 8px 8px 14px; margin-bottom: 12px; }
  .goal-text { font-size: 15px; color: var(--muted); }
  .goal-text b { font-size: 24px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .goal-row.met .goal-text b { color: var(--c); }
  .stepper { display: flex; gap: 6px; }
  .stepper button { min-width: 48px; height: 44px; border-radius: 12px; border: 0; background: var(--card); font-weight: 800; font-size: 18px; }
  .stepper button.plus { background: var(--c); color: #fff; padding: 0 14px; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .day .wd { font-size: 12px; color: var(--muted); font-weight: 500; }
  .day.today .wd { color: var(--ink); font-weight: 800; }
  .dot {
    position: relative;
    width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--empty); border: 2px solid transparent;
    font-size: 13px; font-weight: 500; color: var(--muted);
    transition: background .15s ease, transform .15s ease;
  }
  .dot .n { position: relative; }
  .day.today .dot { border-color: var(--c); color: var(--ink); font-weight: 700; }
  .day.part .dot { background: conic-gradient(var(--c) var(--p), var(--empty) 0); }
  .day.part .dot::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--card); }
  .day.done .dot { background: var(--c); border-color: var(--c); color: #fff; }
  .day.done .dot svg { display: block; width: 55%; height: 55%; }
  .day:not(.done) .dot svg { display: none; }
  .day:active .dot { transform: scale(0.92); }
  .day.pop .dot { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .week-count { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

  /* Add card */
  .addcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 20px; }
  .addcard h2 { margin: 0 0 10px; font-size: 17px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
  input::placeholder { color: var(--muted); }
  .btn { border: 0; border-radius: 14px; padding: 0 20px; background: var(--ink); color: var(--bg); font-weight: 700; min-height: 48px; }
  .btn.full { width: 100%; margin-top: 14px; }
  .btn.danger { background: none; color: var(--danger); padding: 0 8px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--empty); border-radius: 12px; padding: 4px; margin: 12px 0 0; }
  .seg button { border: 0; background: none; border-radius: 9px; padding: 10px 8px; font-weight: 500; font-size: 15px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(10, 20, 40, .12); }

  .goalfields { margin-top: 12px; }
  .gf-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .gf-step { margin-top: 10px; }
  .goalfields label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .goalfields .chips { margin-top: 10px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .chips.scroll .chip { flex: none; }
  .chip { border: 1px solid var(--line); background: var(--empty); border-radius: 99px; padding: 6px 12px; font-weight: 500; font-size: 14px; }

  /* Empty */
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 18px; padding: 22px 18px; }
  .empty h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
  .empty p { margin: 0 0 14px; color: var(--muted); }
  .empty .chip { padding: 8px 14px; font-size: 16px; }

  .foot { margin-top: 28px; font-size: 13px; color: var(--muted); text-align: center; }

  /* Sheets */
  .overlay { position: fixed; inset: 0; background: rgba(8, 14, 28, .5); display: none; align-items: flex-end; justify-content: center; z-index: 10; overflow-y: auto; }
  .overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { margin: 0 0 2px; font-size: 20px; }
  .sheet .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .sheet label.lbl { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
  .colors button[aria-pressed="true"] { border-color: var(--card); box-shadow: 0 0 0 3px var(--ink); }
  .sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; }

  .log-big { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 8px 0 6px; }
  .log-big button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--empty); font-size: 28px; font-weight: 800; }
  .log-big button.plus { background: var(--c); color: #fff; }
  .log-big input { width: 120px; text-align: center; font-size: 40px; font-weight: 800; padding: 6px; background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; font-variant-numeric: tabular-nums; }
  .log-of { text-align: center; color: var(--muted); margin: 0 0 4px; }
  .log-of.met { color: var(--c); font-weight: 700; }

  .sched { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
  .day.rest:not(.done) .dot { opacity: .45; }
  .day.rest:not(.done):not(.today) .dot { background: transparent; border: 2px dashed var(--line); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow button { border: 1px solid var(--line); background: var(--empty); border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 500; color: var(--muted); }
  .dow button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .cal .cell.rest { background: transparent; color: var(--line); }
  .addamt { display: flex; gap: 8px; margin: 0 0 12px; }
  .addamt input { flex: 1; width: auto; min-width: 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
  .addamt button { min-height: 46px; border: 0; border-radius: 12px; padding: 0 18px; background: var(--c); color: #fff; font-weight: 700; }
  .log-note { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .card-foot .week-count { margin: 0; }
  .note-btn { flex: none; border: 1px solid var(--line); background: none; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .note-preview { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--c); background: var(--empty); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--ink); }
  .notenav { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .notenav button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; }
  .notenav button:disabled { opacity: .35; }
  .notenav div { font-weight: 700; }
  textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font: inherit; font-size: 16px; color: inherit; resize: vertical; }
  .lbl2 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
  .nr { display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .nr-d { flex: none; width: 56px; color: var(--muted); }
  .nr-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #noteRecent { max-height: 180px; overflow-y: auto; }

  .ins-hero { display: flex; align-items: center; gap: 16px; }
  .ins-hero > b { font-size: 56px; line-height: .9; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .delta { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .delta.up { color: #0E8A5F; font-weight: 700; }
  .delta.down { color: var(--danger); font-weight: 700; }
  .ins-text { margin: 12px 0 0; font-size: 15px; }
  .col .pv { font-size: 11px; color: var(--muted); height: 14px; }
  .rk { padding: 10px 0; border-top: 1px solid var(--line); }
  .rk:first-of-type { border-top: 0; padding-top: 0; }
  .rk .ph-meta { margin: 0; }
  .rk .meter { margin-bottom: 6px; }
  .tips { margin: 0; padding-left: 18px; font-size: 15px; }
  .tips li { margin: 0 0 8px; }
  .sub-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

  .report { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; margin-bottom: 12px; }
  .rep-title { margin: 0; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; }
  .rep-sub { margin: 4px 0 14px; color: var(--muted); font-size: 14px; }
  .rep-summary p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; }
  .report h3 { margin: 20px 0 10px; font-size: 17px; }
  .report .stats { margin: 14px 0 0; }
  .rep-notes { margin: 0 0 12px; padding: 0; list-style: none; font-size: 14px; }
  .rep-notes li { padding: 6px 0; border-top: 1px solid var(--line); }
  .rep-notes .d { color: var(--muted); margin-right: 8px; }
  .report-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .report-actions .btn { flex: 1 1 auto; min-height: 46px; padding: 0 14px; }
  .btn.ghost { background: var(--empty); color: var(--ink); }
  .sub-note.stale { color: var(--danger); font-weight: 500; }
  .sheet-actions.col { flex-direction: column; align-items: stretch; gap: 10px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .pm { margin: -4px 0 12px; }
  .plist { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13px; color: var(--muted); }
  .plist li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .plist li.met { color: var(--c); font-weight: 700; }
  /* Tabs */
  .tabs { margin: 0 0 20px; }
  .tabs button { font-size: 16px; padding: 11px 8px; }
  .edit-btn { flex: none; border: 1px solid var(--line); background: none; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .habit-top .name-btn { flex: 1 1 auto; }
  .btn.outline-danger { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 0 16px; }

  /* Progress */
  .ptitle { margin: 0 0 14px; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  .pnav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
  .pnav button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 22px; line-height: 1; }
  .pnav button:disabled { opacity: .35; cursor: default; }
  .plabel { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .stat b { display: block; font-size: 32px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .stat span { font-size: 13px; color: var(--muted); line-height: 1.2; display: block; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .pcard h2 { margin: 0 0 12px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .chart { display: flex; gap: var(--gap, 4px); }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .barwrap { width: 100%; height: 100px; background: var(--empty); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
  .barwrap i { display: block; width: 100%; background: var(--accent); }
  .col .lab { font-size: 11px; color: var(--muted); height: 14px; white-space: nowrap; }
  .ph-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .ph-name { font-weight: 700; font-size: 17px; display: flex; gap: 10px; align-items: center; min-width: 0; }
  .ph-name .sw { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex: none; }
  .ph-name span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-rate { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .meter { height: 6px; border-radius: 99px; background: var(--empty); overflow: hidden; margin-bottom: 8px; }
  .meter i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
  .ph-meta { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .hd { font-size: 11px; color: var(--muted); text-align: center; }
  .cal .cell { height: var(--ch, 22px); border-radius: 6px; background: var(--empty); font-size: 11px; color: var(--muted); display: grid; place-items: center; }
  .cal .cell.on { background: var(--c); color: #fff; font-weight: 700; }
  .cal .cell.part { background: var(--empty); box-shadow: inset 0 0 0 2px var(--c); color: var(--ink); }
  .cal .cell.off { background: transparent; border: 1px dashed var(--line); color: var(--line); }
  .cal .cell.today { outline: 2px solid var(--c); outline-offset: 1px; }
  .cal .cell.blank { background: none; }

  /* Toast */
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 14px; display: flex; gap: 12px; align-items: center; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
  .toast button { background: none; border: 0; color: var(--undo); font-weight: 800; padding: 10px 12px; min-height: 44px; }

  @media print {
    :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
      --bg: #fff; --card: #fff; --ink: #111; --muted: #444; --line: #bbb; --empty: #eee;
    }
    body { background: #fff; }
    .tabs, #todayView, .foot, .ptitle, #psub, #pOverview, #pInsights, #pReport .pnav, .report-actions, .toast, .overlay { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .report { border: 0; padding: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar > i, .dot { transition: none; }
    .day.pop .dot { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="seg tabs" role="group" aria-label="View" id="tabs">
    <button type="button" data-tab="today" aria-pressed="true">Today</button>
    <button type="button" data-tab="progress" aria-pressed="false">Progress</button>
  </div>

  <div id="todayView">
  <header>
    <div>
      <p class="date" id="date"></p>
      <h1>Today</h1>
    </div>
    <div class="tally" aria-live="polite">
      <div class="tally-num" id="tallyNum"></div>
      <div class="tally-label" id="tallyLabel">habits done</div>
    </div>
  </header>
  <div class="bar" role="progressbar" aria-label="Today's progress" id="bar"><i id="barFill"></i></div>

  <main id="list"></main>

  <section class="addcard" id="addcard">
    <h2>New habit</h2>
    <input id="newName" type="text" placeholder="Name, like “Drink water”" maxlength="40" autocomplete="off" aria-label="New habit name">
    <div class="seg" role="group" aria-label="Habit type" id="newSeg">
      <button type="button" data-mode="check" aria-pressed="true">Check off</button>
      <button type="button" data-mode="goal" aria-pressed="false">Count toward a goal</button>
    </div>
    <div class="goalfields" id="newPeriod" data-p="new"></div>
    <div class="goalfields" id="newGoal" data-p="new" hidden></div>
    <button class="btn full" id="addBtn">Add habit</button>
  </section>
  </div>

  <div id="progressView" hidden>
    <h1 class="ptitle">Progress</h1>
    <div class="seg three" role="group" aria-label="Progress view" id="psub" style="margin: 0 0 14px">
      <button type="button" data-sub="overview" aria-pressed="true">Overview</button>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function () {
  var COLORS = ["#2F5BFF", "#0E9F6E", "#E0457B", "#C77700", "#8B5CF6", "#0891B2"];
  var SUGGESTIONS = [
    { name: "Drink water", goal: true, target: 64, unit: "oz", step: 8 },
    { name: "Walk", goal: true, target: 30, unit: "minutes", step: 5 },
    { name: "Read", goal: true, target: 10, unit: "pages", step: 1 },
    { name: "Stretch", goal: false },
    { name: "Exercise", goal: false, period: "weekly", target: 3 },
    { name: "Run", goal: true, target: 30, unit: "minutes", step: 5, days: [1, 3, 5] }
  ];
  var DATE_RE = /^\d{4}-\d\d-\d\d$/;
  var LB_KEY = "habit-tracker-lastbackup";
  var ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
  var DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];
  var DOW_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DOW_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var PRESETS = [
    { label: "Every day", days: [0, 1, 2, 3, 4, 5, 6] },
    { label: "Weekdays", days: [1, 2, 3, 4, 5] },
    { label: "Mon, Wed, Fri", days: [1, 3, 5] },
    { label: "Tue, Thu", days: [2, 4] },
    { label: "Weekends", days: [0, 6] }
  ];
  var UNITS = ["times", "minutes", "hours", "glasses", "cups", "pages", "chapters", "words", "steps", "miles", "km", "laps", "reps", "sets", "sessions", "calories", "grams", "oz", "liters", "dollars"];
  var LS_KEY = "habit-tracker-v1";
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  var state = { habits: [] };
  var editingId = null, logging = null, lastToggled = null;
  var newMode = "check", editMode = "check";
  var tab = "today", range = "week", offset = 0;
  var newPeriod = "daily", editPeriod = "daily";
  var psub = "overview", win = 30, repOffset = 0;
  var newSched = ALL_DAYS.slice(), editSched = ALL_DAYS.slice();

  /* ---------- Helpers ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function today() { var t = new Date(); t.setHours(12, 0, 0, 0); return t; }
  function keyToDate(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function posNum(v, fallback) { var n = parseFloat(v); return isFinite(n) && n > 0 ? Math.min(Math.round(n * 100) / 100, 99999) : fallback; }
  function fmt(n) { return String(Math.round(n * 100) / 100); }
  function posInt(v, fallback) { var n = parseInt(v, 10); return isFinite(n) && n >= 1 ? Math.min(n, 9999) : fallback; }
  function byId(id) { return document.getElementById(id); }

  /* Older saved habits only had name/color/done; fill in the new fields */
  function normalize(h) {
    if (typeof h.id !== "string" || !/^[A-Za-z0-9_-]{1,40}$/.test(h.id)) h.id = uid();
    h.name = String(h.name == null ? "" : h.name).slice(0, 40);
    if (typeof h.color !== "string" || !/^#[0-9a-fA-F]{6}$/.test(h.color)) h.color = COLORS[0];
    h.done = Array.isArray(h.done) ? h.done.filter(function (k) { return typeof k === "string" && DATE_RE.test(k); }) : [];
    h.goal = !!h.goal;
    h.target = h.goal ? posNum(h.target, 1) : posInt(h.target, 1);
    h.unit = typeof h.unit === "string" ? h.unit.slice(0, 16) : "";
    h.period = ["daily", "weekly", "monthly"].indexOf(h.period) !== -1 ? h.period : "daily";
    h.days = Array.isArray(h.days) ? h.days.filter(function (n) { return n === Math.floor(n) && n >= 0 && n <= 6; }) : [];
    if (!h.days.length) h.days = ALL_DAYS.slice();
    h.step = posNum(h.step, 1);
    var nn = {};
    if (h.notes && typeof h.notes === "object" && !Array.isArray(h.notes)) {
      Object.keys(h.notes).forEach(function (k) { if (DATE_RE.test(k) && typeof h.notes[k] === "string" && h.notes[k].trim()) nn[k] = h.notes[k].slice(0, 500); });
    }
    h.notes = nn;
    var cc = {};
    if (h.counts && typeof h.counts === "object") {
      Object.keys(h.counts).forEach(function (k) { var n = +h.counts[k]; if (DATE_RE.test(k) && isFinite(n) && n > 0) cc[k] = Math.min(Math.round(n * 100) / 100, 99999); });
    }
    h.counts = cc;
    if (typeof h.created !== "string" || !/^\d{4}-\d\d-\d\d$/.test(h.created)) {
      var ks = h.done.concat(Object.keys(h.counts)).sort();
      h.created = ks.length ? ks[0] : dkey(today());
    }
    return h;
  }
  function normalizeState(s) { return { habits: (s.habits || []).map(normalize) }; }

  /* ---------- Storage: account (db) when available, always mirrored on this device ---------- */
  var docRef = null, saving = false, dirty = false, timer = null;

  function lsLoad() { try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function setStatus(synced) {
    updateBackupNote();
    byId("status").textContent = synced
      ? "Saved to your account. Your habits follow you to any device."
      : "Saved on this device.";
  }
  function flush() {
    if (!docRef || saving || !dirty) return;
    saving = true; dirty = false;
    docRef.set({ habits: state.habits, v: 2 }).then(function () { setStatus(true); }, function () { setStatus(false); })
      .then(function () { saving = false; if (dirty) flush(); });
  }
  function persist() {
    lsSave();
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(flush, 500);
  }
  function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      Promise.all([window.claude.use("user"), window.claude.use("db")]).then(function (r) {
        var user = r[0], db = r[1];
        if (!user || !db) return null;
        return user.id().then(function (id) {
          if (!id) return null;
          docRef = db.collection("data/users/" + id).doc("habits");
          return docRef.get().then(function (snap) {
            if (snap.exists) {
              var d = snap.data();
              if (d && Array.isArray(d.habits)) { state = normalizeState(d); lsSave(); render(); }
            } else if (state.habits.length) { dirty = true; flush(); }
            setStatus(true);
          });
        });
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- Logic ---------- */
  function amount(h, k) { return h.counts[k] || 0; }
  /* A day counts as "done" when the daily goal is met. For weekly/monthly targets, a day counts when it was logged. */
  function isDone(h, k) {
    if (h.goal) return h.period === "daily" ? amount(h, k) >= h.target : amount(h, k) > 0;
    return h.done.indexOf(k) !== -1;
  }
  function sched(h, k) { return h.period !== "daily" || h.days.indexOf(keyToDate(k).getDay()) !== -1; }
  function schedLabel(days) {
    var sel = DOW_ORDER.filter(function (n) { return days.indexOf(n) !== -1; });
    var key = sel.join(",");
    if (sel.length === 7) return "Every day";
    if (key === "1,2,3,4,5") return "Weekdays";
    if (key === "6,0") return "Weekends";
    return sel.map(function (n) { return DOW_NAMES[n]; }).join(", ");
  }
  function weekStart(d) { var x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function periodRange(h, ref) {
    if (h.period === "weekly") { var s = weekStart(ref); return { start: s, end: addDays(s, 6) }; }
    return { start: new Date(ref.getFullYear(), ref.getMonth(), 1, 12), end: new Date(ref.getFullYear(), ref.getMonth() + 1, 0, 12) };
  }
  function periodValue(h, r) {
    var v = 0, d = new Date(r.start), lim = dkey(today()), end = dkey(r.end), guard = 0;
    while (dkey(d) <= end && dkey(d) <= lim && guard++ < 40) {
      var k = dkey(d);
      if (h.goal) v += amount(h, k); else if (h.done.indexOf(k) !== -1) v++;
      d = addDays(d, 1);
    }
    return Math.round(v * 100) / 100;
  }
  function periodMet(h, r) { return periodValue(h, r) >= h.target; }
  function periodUnit(h) { return h.period === "weekly" ? "week" : h.period === "monthly" ? "month" : "day"; }
  function todayComplete(h) {
    var k = dkey(today());
    if (h.period === "daily") return isDone(h, k);
    return isDone(h, k) || periodMet(h, periodRange(h, today()));
  }
  function bestPeriodStreak(h) {
    var best = 0, cur = 0, guard = 0, s = periodRange(h, keyToDate(h.created)).start, lim = dkey(today());
    while (dkey(s) <= lim && guard++ < 1000) {
      var r = periodRange(h, s);
      if (periodMet(h, r)) { cur++; if (cur > best) best = cur; } else cur = 0;
      s = addDays(r.end, 1);
    }
    return best;
  }
  function streak(h) {
    var n = 0, guard = 0;
    if (h.period === "daily") {
      /* Rest days never break a streak; a missed scheduled day does. Today is still pending until it's over. */
      var d = today(), first = true;
      while (dkey(d) >= h.created && guard++ < 4000) {
        var k = dkey(d);
        if (isDone(h, k)) n++;
        else if (sched(h, k) && !first) break;
        first = false;
        d = addDays(d, -1);
      }
      return n;
    }
    var r = periodRange(h, today());
    if (!periodMet(h, r)) r = periodRange(h, addDays(r.start, -1));
    while (dkey(r.end) >= h.created && periodMet(h, r) && guard++ < 1000) { n++; r = periodRange(h, addDays(r.start, -1)); }
    return n;
  }
  function bestStreak(h) {
    if (h.period !== "daily") return bestPeriodStreak(h);
    var d = keyToDate(h.created), end = dkey(today()), best = 0, cur = 0, guard = 0;
    while (dkey(d) <= end && guard++ < 4000) {
      if (isDone(h, dkey(d))) { cur++; if (cur > best) best = cur; } else if (sched(h, dkey(d))) cur = 0;
      d = addDays(d, 1);
    }
    return best;
  }
  function find(id) { return state.habits.filter(function (x) { return x.id === id; })[0]; }
  function unitText(h) { return h.unit ? " " + h.unit : ""; }

  function toggle(id, k) {
    var h = find(id); if (!h) return;
    if (k < h.created) h.created = k;
    var i = h.done.indexOf(k);
    if (i === -1) { h.done.push(k); lastToggled = id + "|" + k; } else { h.done.splice(i, 1); lastToggled = null; }
    persist(); render();
  }
  function setCount(h, k, n) {
    n = Math.max(0, Math.min(99999, Math.round(n * 100) / 100 || 0));
    if (k < h.created) h.created = k;
    var wasDone = isDone(h, k);
    if (n === 0) delete h.counts[k]; else h.counts[k] = n;
    lastToggled = (!wasDone && isDone(h, k)) ? h.id + "|" + k : null;
    persist(); render();
  }
  function addHabit(opts) {
    var name = (opts.name || "").trim();
    if (!name) return false;
    var h = normalize({
      id: uid(), name: name, color: COLORS[state.habits.length % COLORS.length],
      goal: !!opts.goal, period: opts.period, days: opts.days, target: opts.target, unit: opts.unit || "", step: opts.step
    });
    state.habits.push(h);
    persist(); render();
    return true;
  }

  /* ---------- Render ---------- */
  function render() {
    var t = today(), tk = dkey(t);
    byId("date").textContent = t.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    var active = state.habits.filter(function (h) { return sched(h, tk) || isDone(h, tk); });
    var total = active.length;
    var doneToday = active.filter(todayComplete).length;
    var pct = total ? Math.round(doneToday / total * 100) : 0;
    byId("tallyNum").innerHTML = (total || !state.habits.length) ? doneToday + "<small> / " + total + "</small>" : "<small>Rest day</small>";
    byId("tallyLabel").textContent = (total || !state.habits.length) ? "habits done" : "nothing scheduled today";
    byId("barFill").style.width = pct + "%";
    byId("bar").setAttribute("aria-valuenow", pct);

    var days = [];
    for (var i = 6; i >= 0; i--) days.push(addDays(t, -i));

    var html = "";
    if (!state.habits.length) {
      html = '<div class="empty"><h2>Start with one habit</h2><p>Pick a suggestion, or build your own below.</p><div class="chips">' +
        SUGGESTIONS.map(function (s, i) {
          var label = s.goal ? s.name + " · " + s.target + " " + s.unit : (s.period === "weekly" ? s.name + " · " + s.target + " days/week" : s.name);
          if (s.days) label += " · " + schedLabel(s.days);
          return '<button class="chip" data-suggest="' + i + '">' + esc(label) + "</button>";
        }).join("") + "</div></div>";
    } else {
      html = state.habits.map(function (h) {
        var s = streak(h);
        var weekDone = days.filter(function (d) { return isDone(h, dkey(d)); }).length;
        var cells = days.map(function (d) {
          var k = dkey(d), done = isDone(h, k), isToday = k === tk, amt = amount(h, k);
          var part = h.goal && h.period === "daily" && !done && amt > 0;
          var cls = "day" + (done ? " done" : "") + (!done && !sched(h, k) ? " rest" : "") + (part ? " part" : "") + (isToday ? " today" : "") + (lastToggled === h.id + "|" + k ? " pop" : "");
          var style = part ? ' style="--p:' + Math.round(amt / h.target * 100) + '%"' : "";
          var label = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) + ", " + h.name +
            (h.goal ? (h.period === "daily" ? ", " + amt + " of " + h.target + unitText(h) : ", " + amt + unitText(h)) : (done ? ", done" : ", not done")) + (!done && !sched(h, k) ? ", rest day" : "");
          return '<button class="' + cls + '"' + style + ' data-h="' + h.id + '" data-k="' + k + '"' +
            (h.goal ? "" : ' aria-pressed="' + done + '"') + ' aria-label="' + esc(label) + '">' +
            '<span class="wd">' + d.toLocaleDateString(undefined, { weekday: "short" }) + "</span>" +
            '<span class="dot">' + CHECK + '<span class="n">' + (done ? "" : d.getDate()) + "</span></span></button>";
        }).join("");

        var goalRow = "";
        var stepper = h.goal
          ? '<div class="stepper"><button data-dec="' + h.id + '" aria-label="Subtract ' + h.step + " from " + esc(h.name) + '">&minus;</button>' +
            '<button class="plus" data-inc="' + h.id + '" aria-label="Add ' + h.step + " to " + esc(h.name) + '">+' + h.step + "</button></div>"
          : "";
        if (h.period === "daily") {
          if (h.goal) {
            var a = amount(h, tk);
            goalRow = '<div class="goal-row' + (a >= h.target ? " met" : "") + '"><div class="goal-text"><b>' + fmt(a) + "</b> / " + h.target + esc(unitText(h)) + (sched(h, tk) ? " today" : " today · rest day") + "</div>" + stepper + "</div>";
          }
        } else {
          var pv = periodValue(h, periodRange(h, t));
          var what = h.goal ? unitText(h) : (h.target === 1 ? " day" : " days");
          goalRow = '<div class="goal-row' + (pv >= h.target ? " met" : "") + '"><div class="goal-text"><b>' + fmt(pv) + "</b> / " + h.target + esc(what) + " this " + periodUnit(h) + "</div>" + stepper + "</div>" +
            '<div class="meter pm"><i style="width:' + Math.min(100, Math.round(pv / h.target * 100)) + '%"></i></div>';
        }
        if (h.goal) {
          goalRow += '<div class="addamt"><input type="number" inputmode="decimal" min="0" step="any" data-amtinput="' + h.id + '" placeholder="Custom amount' + (h.unit ? " (" + esc(h.unit) + ")" : "") + '" aria-label="Add a custom amount to ' + esc(h.name) + '">' +
            '<button data-addamt="' + h.id + '">Add</button></div>';
        }
        var nCount = Object.keys(h.notes).length;
        var noteLabel = nCount ? "Notes (" + nCount + ")" : "Add note";
        var todayNote = h.notes[tk];

  /* ---------- Progress view ---------- */
  function periodDays() {

  function habitProgress(h, days, tk, month) {
    var out = { h: h, rate: null, meta: "", list: null };
    var last = days[days.length - 1];
    if (h.period === "daily") {
      var el = 0, dn = 0, total = 0;
      days.forEach(function (d) {
        var k = dkey(d);
        if (k <= tk) total += amount(h, k);
        if (k <= tk && k >= h.created && sched(h, k)) { el++; if (isDone(h, k)) dn++; }
      });
      out.rate = el ? dn / el : null;
      out.el = el; out.dn = dn; out.total = total;
      out.meta = el ? dn + " of " + el + (h.days.length < 7 ? " scheduled days" : " days") : "Nothing scheduled in this period";
      if (h.goal && total) out.meta += " · " + fmt(total) + unitText(h) + " total";
    } else {
      var pers = [];
      if (h.period === "weekly") {
        if (!month) pers.push(periodRange(h, days[0]));
        else { var s = weekStart(days[0]); while (dkey(s) <= dkey(last)) { pers.push({ start: s, end: addDays(s, 6) }); s = addDays(s, 7); } }
      } else {

      }
      var rows = pers.filter(function (r) { return dkey(r.start) <= tk && dkey(r.end) >= h.created; }).map(function (r) {
        var v = periodValue(h, r);
        return { label: fmtRange(h, r), v: v, met: v >= h.target };
      });
      if (rows.length) {
        var sum = 0, tgt = 0;
        rows.forEach(function (r) { sum += Math.min(r.v, h.target); tgt += h.target; });

        out.rows = rows;
        var what = h.goal ? unitText(h) : (h.target === 1 ? " day" : " days");
        if (rows.length === 1) out.meta = rows[0].v + " of " + h.target + what + " · " + rows[0].label;
        else {
          out.meta = rows.filter(function (r) { return r.met; }).length + " of " + rows.length + " weeks met · target " + h.target + what + "/week";
          out.list = rows;
        }
      } else out.meta = "Not started in this period";
    }

  function renderProgress() {
    var days = periodDays(), tk = dkey(today()), month = range === "month";
    var label;

      label = days[0].toLocaleDateString(undefined, o) + " – " + days[6].toLocaleDateString(undefined, o);
    } else {
      label = days[0].toLocaleDateString(undefined, { month: "long", year: "numeric" });
    }
    byId("pLabel").textContent = label;
    byId("nextP").disabled = offset >= 0;
    var body = byId("pBody");

  /* ---------- Insights ---------- */

  /* ---------- Monthly report ---------- */

    r.prevName = pdays[0].toLocaleDateString(undefined, { month: "long" });
    r.items = state.habits.map(function (h) { return habitProgress(h, days, tk, true); });

  function reportMeta(it) {

  function reportMarkdown(r) {

    if (r.notes.length) {
      L.push("", "## Notes", "");
      r.notes.forEach(function (g) {
        L.push("### " + g.h.name, "");
        g.list.forEach(function (n) { L.push("- " + shortDate(n.k) + ": " + n.text); });
        L.push("");
      });
    }
    return L.join("\n").replace(/\n{3,}/g, "\n\n") + "\n";
  }

  function renderProgressView() {
    if (psub === "insights") renderInsights();
    else if (psub === "report") renderReport();
    else renderProgress();
  }

  function setTab(name) {
    tab = name;
    byId("todayView").hidden = name !== "today";
    byId("progressView").hidden = name !== "progress";
    Array.prototype.forEach.call(byId("tabs").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-tab") === name));
    });
    if (name === "progress") renderProgressView(); else render();
    window.scrollTo(0, 0);
  }
  byId("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (b) setTab(b.getAttribute("data-tab"));
  });
  byId("rangeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-range]"); if (!b) return;
    range = b.getAttribute("data-range"); offset = 0;
    Array.prototype.forEach.call(byId("rangeSeg").querySelectorAll("button"), function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
    renderProgress();
  });
  byId("prevP").addEventListener("click", function () { offset--; renderProgress(); });
  byId("nextP").addEventListener("click", function () { if (offset < 0) { offset++; renderProgress(); } });

  /* ---------- Saving files, backup and restore ---------- */
  function saveFile(name, data, mime, ok) {
    function blobSave() {
      try {
        var b = new Blob([data], { type: mime + ";charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        if (ok) ok();
      } catch (e) { showToast("Could not save the file here."); }
    }
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) { blobSave(); return; }
        return dl.save({ filename: name, data: data }).then(function () { if (ok) ok(); }, function (err) {
          if (!err || err.code !== "declined") showToast("Could not save the file here.");
        });
      }).catch(blobSave);
    } else blobSave();
  }
  function lastBackup() { try { return localStorage.getItem(LB_KEY); } catch (e) { return null; } }
  function updateBackupNote() {
    var el = byId("backupNote"); if (!el) return;
    var lb = lastBackup();
    var txt = docRef ? "Your habits are saved to your account. You can still keep a copy, or bring in a backup from another device."
      : "Your habits are saved in this browser only. Export a backup to keep them safe or move them to another device.";
    if (lb && DATE_RE.test(lb)) txt += " Last backup: " + shortDate(lb) + "."; else if (state.habits.length) txt += " No backup yet.";
    var stale = !docRef && state.habits.length && (!lb || !DATE_RE.test(lb) || (today() - keyToDate(lb)) / 86400000 > 14);
    el.textContent = txt;
    el.className = "sub-note" + (stale ? " stale" : "");
  }
  function parseBackup(text) {
    var d = JSON.parse(text);
    var list = Array.isArray(d) ? d : d && d.habits;
    if (!Array.isArray(list)) throw new Error("not a backup");
    var seen = {};
    var habits = list.filter(function (x) { return x && typeof x === "object" && typeof x.name === "string" && x.name.trim(); }).map(function (x) {
      var h = normalize(x);
      if (seen[h.id]) h.id = uid();
      seen[h.id] = 1;
      return h;
    });
    if (!habits.length) throw new Error("empty");
    return { habits: habits, exported: d && typeof d.exported === "string" ? d.exported.slice(0, 10) : null };
  }
  function mergeHabits(cur, inc) {
    var byIdMap = {};
    cur.forEach(function (h) { byIdMap[h.id] = h; });
    inc.forEach(function (n) {
      var c = byIdMap[n.id];
      if (!c) { cur.push(n); byIdMap[n.id] = n; return; }
      n.done.forEach(function (k) { if (c.done.indexOf(k) === -1) c.done.push(k); });
      Object.keys(n.counts).forEach(function (k) { c.counts[k] = Math.max(c.counts[k] || 0, n.counts[k]); });
      Object.keys(n.notes).forEach(function (k) { if (!c.notes[k]) c.notes[k] = n.notes[k]; });
      if (n.created < c.created) c.created = n.created;
    });
    return cur;
  }
  var pendingImport = null;
  var importOverlay = byId("importOverlay");
  function closeImport() { importOverlay.classList.remove("open"); pendingImport = null; }
  function applyImport(mode) {
    if (!pendingImport) return;
    var before = JSON.parse(JSON.stringify(state));
    var n = pendingImport.habits.length;
    if (mode === "replace") state = { habits: pendingImport.habits };
    else state = { habits: mergeHabits(state.habits, pendingImport.habits) };
    closeImport();
    persist(); render();
    showToast("Imported " + plural(n, "habit"), function () { state = before; persist(); render(); });
  }
  byId("exportBtn").addEventListener("click", function () {
    var data = { app: "habit-tracker", version: 2, exported: new Date().toISOString(), habits: state.habits };
    saveFile("habit-backup-" + dkey(today()) + ".json", JSON.stringify(data, null, 2), "application/json", function () {
      try { localStorage.setItem(LB_KEY, dkey(today())); } catch (e) {}
      updateBackupNote();
      showToast("Backup saved");
    });
  });
  byId("importBtn").addEventListener("click", function () { byId("importFile").click(); });
  byId("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var parsed;
      try { parsed = parseBackup(String(rd.result)); } catch (err) { showToast("That file isn't a valid habit backup."); return; }
      pendingImport = parsed;
      byId("importInfo").textContent = "This backup has " + plural(parsed.habits.length, "habit") + (parsed.exported ? " (exported " + shortDate(parsed.exported) + ")" : "") +
        ". You currently have " + plural(state.habits.length, "habit") + ". Merging keeps both and combines matching habits; replacing swaps in the backup.";
      importOverlay.classList.add("open");
    };
    rd.onerror = function () { showToast("Could not read that file."); };
    rd.readAsText(f);
    try { e.target.value = ""; } catch (err) {}
  });
  byId("impMerge").addEventListener("click", function () { applyImport("merge"); });
  byId("impReplace").addEventListener("click", function () { applyImport("replace"); });
  byId("impCancel").addEventListener("click", closeImport);
  importOverlay.addEventListener("click", function (e) { if (e.target === importOverlay) closeImport(); });

  byId("psub").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sub]"); if (!b) return;
    psub = b.getAttribute("data-sub");
    Array.prototype.forEach.call(byId("psub").querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    byId("pOverview").hidden = psub !== "overview";
    byId("pInsights").hidden = psub !== "insights";
    byId("pReport").hidden = psub !== "report";
    renderProgressView();
  });
  byId("winSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-win]"); if (!b) return;
    win = parseInt(b.getAttribute("data-win"), 10) || 0;
    Array.prototype.forEach.call(byId("winSeg").querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    renderInsights();
  });
  byId("prevR").addEventListener("click", function () { repOffset--; renderReport(); });
  byId("nextR").addEventListener("click", function () { if (repOffset < 0) { repOffset++; renderReport(); } });

  function reportText() { return reportMarkdown(buildReport(repOffset)); }
  byId("repDownload").addEventListener("click", function () {
    var r = buildReport(repOffset);
    saveFile("habit-report-" + dkey(r.days[0]).slice(0, 7) + ".md", reportMarkdown(r), "text/markdown", function () { showToast("Report saved"); });
  });
  byId("repCopy").addEventListener("click", function () {
    var text = reportText();
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(ok ? "Report copied" : "Could not copy. Try Download instead.");
      } catch (e) { showToast("Could not copy. Try Download instead."); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { showToast("Report copied"); }, fallback);
    else fallback();
  });
  byId("repPrint").addEventListener("click", function () { try { window.print(); } catch (e) { showToast("Printing isn't available here. Try Download instead."); } });

  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  /* ---------- Start ---------- */
  var saved = lsLoad();
  if (saved && Array.isArray(saved.habits)) state = normalizeState(saved);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  setStatus(false);
  render();
  initCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
